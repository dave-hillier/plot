<svg class="plot" fill="currentColor" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" width="960" height="150" viewBox="0 0 960 150" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    :where(.plot) {
      --plot-background: white;
      display: block;
      height: auto;
      height: intrinsic;
      max-width: 100%;
    }

    :where(.plot text),
    :where(.plot tspan) {
      white-space: pre;
    }
  </style>
  <defs>
    <clipPath id="plot-rid-1">
      <rect x="300" y="20" width="640" height="100"></rect>
    </clipPath>
  </defs>
  <g aria-label="x-axis" transform="translate(0,120)" fill="none" font-size="10" font-variant="tabular-nums" text-anchor="middle">
