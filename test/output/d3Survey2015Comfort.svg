  <g aria-label="y-axis" transform="translate(300,0)" fill="none" font-size="10" font-variant="tabular-nums" text-anchor="end">
    <line y1="20" y2="120" stroke="currentColor"></line>
    <g transform="translate(0,20)">
      <line x2="-6" stroke="currentColor"></line>
      <text x="-9" dy="0.32em" fill="currentColor"></text>
    </g>
    <g transform="translate(0,40)">
      <line x2="-6" stroke="currentColor"></line>
      <text x="-9" dy="0.32em" fill="currentColor">I looked at some examples!</text>
    </g>
    <g transform="translate(0,60)">
      <line x2="-6" stroke="currentColor"></line>
      <text x="-9" dy="0.32em" fill="currentColor">I've forked a bl.ock or two</text>
    </g>
    <g transform="translate(0,80)">
      <line x2="-6" stroke="currentColor"></line>
      <text x="-9" dy="0.32em" fill="currentColor">Someone told me I should learn it...</text>
    </g>
    <g transform="translate(0,100)">
      <line x2="-6" stroke="currentColor"></line>
      <text x="-9" dy="0.32em" fill="currentColor">selectAll(".answers").enter()</text>
