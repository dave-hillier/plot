    <g transform="translate(684,0)">
      <line y2="6" stroke="currentColor"></line>
      <text y="9" dy="0.71em" fill="currentColor">60</text>
    </g>
    <g transform="translate(748,0)">
      <line y2="6" stroke="currentColor"></line>
      <text y="9" dy="0.71em" fill="currentColor">70</text>
    </g>
    <g transform="translate(812,0)">
      <line y2="6" stroke="currentColor"></line>
