<svg class="plot" fill="currentColor" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" width="640" height="120" viewBox="0 0 640 120" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    :where(.plot) {
      --plot-background: white;
      display: block;
      height: auto;
      height: intrinsic;
      max-width: 100%;
    }

    :where(.plot text),
    :where(.plot tspan) {
      white-space: pre;
    }
  </style>
  <g aria-label="y-axis tick" aria-hidden="true" fill="none" stroke="currentColor" transform="translate(-0.5,10)">
    <path transform="translate(75,23)" d="M0,0L-6,0"></path>
    <path transform="translate(75,45)" d="M0,0L-6,0"></path>
    <path transform="translate(75,67)" d="M0,0L-6,0"></path>
  </g>
  <g aria-label="y-axis tick label" text-anchor="end" transform="translate(-9,10)">
    <text transform="translate(75,23)" y="0.32em">Adelie</text>
    <text transform="translate(75,45)" y="0.32em">Gentoo</text>
    <text transform="translate(75,67)" y="0.32em">Chinstrap</text>
  </g>
  <g aria-label="y-axis label" transform="translate(-72,0)">
    <text transform="translate(75,55) rotate(-90)" y="0.71em">species</text>
  </g>
  <g aria-label="x-axis tick" aria-hidden="true" fill="none" stroke="currentColor" transform="translate(0,-0.5)">
    <path transform="translate(75,90)" d="M0,0L0,6"></path>
    <path transform="translate(145.395,90)" d="M0,0L0,6"></path>
    <path transform="translate(215.789,90)" d="M0,0L0,6"></path>
    <path transform="translate(286.184,90)" d="M0,0L0,6"></path>
    <path transform="translate(356.579,90)" d="M0,0L0,6"></path>
    <path transform="translate(426.974,90)" d="M0,0L0,6"></path>
    <path transform="translate(497.368,90)" d="M0,0L0,6"></path>
    <path transform="translate(567.763,90)" d="M0,0L0,6"></path>
  </g>
  <g aria-label="x-axis tick label" font-variant="tabular-nums" transform="translate(0,9)">
    <text transform="translate(75,90)" y="0.71em">0</text>
    <text transform="translate(145.395,90)" y="0.71em">20</text>
    <text transform="translate(215.789,90)" y="0.71em">40</text>
    <text transform="translate(286.184,90)" y="0.71em">60</text>
    <text transform="translate(356.579,90)" y="0.71em">80</text>
    <text transform="translate(426.974,90)" y="0.71em">100</text>
    <text transform="translate(497.368,90)" y="0.71em">120</text>
    <text transform="translate(567.763,90)" y="0.71em">140</text>
  </g>
  <g aria-label="x-axis label" text-anchor="end" transform="translate(17,27)">
    <text transform="translate(620,90)">Frequency →</text>
  </g>
  <g aria-label="bar">
    <rect fill="#efb118" x="75" y="23" width="256.941" height="20"><title>MALE (73)</title></rect>
    <rect fill="#efb118" x="75" y="67" width="119.671" height="20"><title>MALE (34)</title></rect>
    <rect fill="#efb118" x="75" y="45" width="214.704" height="20"><title>MALE (61)</title></rect>
    <rect fill="#4269d0" x="331.941" y="23" width="256.941" height="20"><title>FEMALE (73)</title></rect>
    <rect fill="#4269d0" x="194.671" y="67" width="119.671" height="20"><title>FEMALE (34)</title></rect>
    <rect fill="#4269d0" x="289.704" y="45" width="204.145" height="20"><title>FEMALE (58)</title></rect>
    <rect fill="#ff725c" x="588.882" y="23" width="21.118" height="20"><title>null (6)</title></rect>
    <rect fill="#ff725c" x="493.849" y="45" width="17.599" height="20"><title>null (5)</title></rect>
  </g>
  <rect aria-label="frame" fill="none" stroke="currentColor" x="75" y="20" width="545" height="70"></rect>
  <g aria-label="text" text-anchor="end" font-style="italic" transform="translate(-3,-3)">
    <text transform="translate(620,90)"><tspan x="0" y="-2em">Count of penguins</tspan><tspan x="0" dy="1em">grouped by species</tspan><tspan x="0" dy="1em"> and colored by sex</tspan></text>
  </g>
</svg>