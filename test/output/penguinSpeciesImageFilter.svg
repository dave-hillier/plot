<svg class="plot" fill="currentColor" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" width="640" height="400" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    :where(.plot) {
      --plot-background: white;
      display: block;
      height: auto;
      height: intrinsic;
      max-width: 100%;
    }

    :where(.plot text),
    :where(.plot tspan) {
      white-space: pre;
    }
  </style>
  <defs>
    <clipPath id="plot-rid-1">
      <rect x="40" y="20" width="580" height="350"></rect>
    </clipPath>
  </defs>
  <g aria-label="x-axis" transform="translate(0,370)" fill="none" font-size="10" font-variant="tabular-nums" text-anchor="middle">
    <line x1="40" x2="620" stroke="currentColor"></line>
    <g transform="translate(59,0)">
      <line y2="6" stroke="currentColor"></line>
      <text y="9" dy="0.71em" fill="currentColor">Adelie</text>
    </g>
    <g transform="translate(246,0)">
      <line y2="6" stroke="currentColor"></line>
      <text y="9" dy="0.71em" fill="currentColor">Chinstrap</text>
    </g>
    <g transform="translate(433,0)">
      <line y2="6" stroke="currentColor"></line>
      <text y="9" dy="0.71em" fill="currentColor">Gentoo</text>
    </g>
  </g>
  <g aria-label="y-axis" transform="translate(40,0)" fill="none" font-size="10" font-variant="tabular-nums" text-anchor="end">
    <line y1="20" y2="370" stroke="currentColor"></line>
    <g transform="translate(0,195)">
      <line x2="-6" stroke="currentColor"></line>
      <text x="-9" dy="0.32em" fill="currentColor">0</text>
    </g>
  </g>
  <g aria-label="bar" fill="currentColor" filter="drop-shadow(3px 3px red) sepia(40%) drop-shadow(-3px -3px currentColor)">
    <rect x="59" y="20" width="168" height="350"></rect>
    <rect x="246" y="20" width="168" height="350"></rect>
    <rect x="433" y="20" width="168" height="350"></rect>
  </g>
  <g aria-label="rule" stroke="currentColor">0</g>
</svg>