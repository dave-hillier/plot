  </g>
  <g aria-label="x-axis label" text-anchor="end" transform="translate(17.5,27.5)">
    <text transform="translate(620,130)">Frequency (thousands) →</text>
  </g>
  <g aria-label="waffle">
    <defs>
      <pattern id="plot-pattern-1" width="5.382" height="5.382" patternUnits="userSpaceOnUse">
        <rect x="0.5" y="0.5" width="4.382" height="4.382" fill="rgb(110, 64, 170)"></rect>
      </pattern>
      <pattern id="plot-pattern-2" width="5.382" height="5.382" patternUnits="userSpaceOnUse">
        <rect x="0.5" y="0.5" width="4.382" height="4.382" fill="rgb(65, 125, 224)"></rect>
