    <path d="M0,0L0,0L0,0L0,0L0,0L0,16.147L290.651,16.147L290.651,16.147L294.257,16.147L294.257,10.765L296.033,10.765L296.033,0Z" transform="translate(80,i=>barx(i)+tx)" fill="url(#plot-pattern-1)"></path>
