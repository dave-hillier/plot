    <path d="M0,0L0,0L0,0L0,0L0,0L0,16.147L220.679,16.147L220.679,10.765L223.693,10.765L223.693,5.382L226.062,5.382L226.062,0Z" transform="translate(80,i=>barx(i)+tx)" fill="url(#plot-pattern-4)"></path>
