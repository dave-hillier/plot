    <path transform="translate(80,108)" d="M0,0L-6,0"></path>
  </g>
  <g aria-label="y-axis tick label" text-anchor="end" transform="translate(-8.5,10)">
    <text transform="translate(80,24)" y="0.32em">Infants &lt;1</text>
    <text transform="translate(80,45)" y="0.32em">Children &lt;11</text>
    <text transform="translate(80,66)" y="0.32em">Teens 12-17</text>
    <text transform="translate(80,87)" y="0.32em">Adults 18+</text>
    <text transform="translate(80,108)" y="0.32em">Elderly 65+</text>
  </g>
  <g aria-label="x-axis tick" aria-hidden="true" fill="none" stroke="currentColor" transform="translate(0.5,0)">
    <path transform="translate(80,130)" d="M0,0L0,6"></path>
    <path transform="translate(169.707,130)" d="M0,0L0,6"></path>
    <path transform="translate(259.414,130)" d="M0,0L0,6"></path>
    <path transform="translate(349.121,130)" d="M0,0L0,6"></path>
    <path transform="translate(438.828,130)" d="M0,0L0,6"></path>
    <path transform="translate(528.535,130)" d="M0,0L0,6"></path>
    <path transform="translate(618.242,130)" d="M0,0L0,6"></path>
  </g>
  <g aria-label="x-axis tick label" font-variant="tabular-nums" transform="translate(0.5,9.5)">
    <text transform="translate(80,130)" y="0.71em">0</text>
    <text transform="translate(169.707,130)" y="0.71em">5</text>
    <text transform="translate(259.414,130)" y="0.71em">10</text>
    <text transform="translate(349.121,130)" y="0.71em">15</text>
