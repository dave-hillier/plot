<svg class="plot" fill="currentColor" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" width="640" height="160" viewBox="0 0 640 160" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    :where(.plot) {
      --plot-background: white;
      display: block;
      height: auto;
      height: intrinsic;
      max-width: 100%;
    }

    :where(.plot text),
    :where(.plot tspan) {
      white-space: pre;
    }
  </style>
  <defs>
    <clipPath id="plot-rid-1">
      <rect x="80" y="20" width="559" height="120"></rect>
    </clipPath>
  </defs>
  <g aria-label="y-axis" transform="translate(80,0)" fill="none" font-size="10" font-variant="tabular-nums" text-anchor="end">
    <line y1="20" y2="140" stroke="currentColor"></line>
    <g transform="translate(0,24)">
      <line x2="-6" stroke="currentColor"></line>
      <text x="-9" dy="0.32em" fill="currentColor">Adults 18+</text>
    </g>
    <g transform="translate(0,47)">
      <line x2="-6" stroke="currentColor"></line>
      <text x="-9" dy="0.32em" fill="currentColor">Children &lt;11</text>
    </g>
    <g transform="translate(0,70)">
      <line x2="-6" stroke="currentColor"></line>
      <text x="-9" dy="0.32em" fill="currentColor">Elderly 65+</text>
    </g>
    <g transform="translate(0,93)">
      <line x2="-6" stroke="currentColor"></line>
      <text x="-9" dy="0.32em" fill="currentColor">Infants &lt;1</text>
    </g>
    <g transform="translate(0,116)">
      <line x2="-6" stroke="currentColor"></line>
      <text x="-9" dy="0.32em" fill="currentColor">Teens 12-17</text>
    </g>
  </g>
  <g aria-label="x-axis bottom" transform="translate(0,140)" fill="none" font-size="10" font-variant="tabular-nums" text-anchor="middle">
    <line x1="80" x2="639" stroke="currentColor" stroke-opacity="1"></line>
    <g transform="translate(359.5,0)">
      <line y2="6" stroke="currentColor" stroke-opacity="1"></line>
      <text y="9" dy="0.71em" text-anchor="middle" fill="currentColor">0</text>
    </g>
    <text x="359.5" y="34" fill="currentColor" text-anchor="middle" font-size="12" font-variant="normal">Frequency (thousands) →</text>
  </g>
  <g aria-label="waffle" fill="currentColor">00000</g>
  <g aria-label="rule" stroke="currentColor">0</g>
</svg>