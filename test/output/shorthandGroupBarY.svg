<svg class="plot" fill="currentColor" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" width="640" height="400" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    :where(.plot) {
      --plot-background: white;
      display: block;
      height: auto;
      height: intrinsic;
      max-width: 100%;
    }

    :where(.plot text),
    :where(.plot tspan) {
      white-space: pre;
    }
  </style>
  <g aria-label="y-axis tick" aria-hidden="true" fill="none" stroke="currentColor" transform="translate(0,0.5)">
    <path transform="translate(40,370)" d="M0,0L-6,0"></path>
    <path transform="translate(40,320)" d="M0,0L-6,0"></path>
    <path transform="translate(40,270)" d="M0,0L-6,0"></path>
    <path transform="translate(40,220)" d="M0,0L-6,0"></path>
    <path transform="translate(40,170)" d="M0,0L-6,0"></path>
    <path transform="translate(40,120)" d="M0,0L-6,0"></path>
    <path transform="translate(40,70)" d="M0,0L-6,0"></path>
    <path transform="translate(40,20)" d="M0,0L-6,0"></path>
  </g>
  <g aria-label="y-axis tick label" text-anchor="end" font-variant="tabular-nums" transform="translate(-8.5,0.5)">
    <text transform="translate(40,370)" y="0.32em">0</text>
    <text transform="translate(40,320)" y="0.32em">5</text>
    <text transform="translate(40,270)" y="0.32em">10</text>
    <text transform="translate(40,220)" y="0.32em">15</text>
    <text transform="translate(40,170)" y="0.32em">20</text>
    <text transform="translate(40,120)" y="0.32em">25</text>
    <text transform="translate(40,70)" y="0.32em">30</text>
    <text transform="translate(40,20)" y="0.32em">35</text>
  </g>
  <g aria-label="y-axis label" text-anchor="start" transform="translate(-36.5,-16.5)">
    <text transform="translate(40,20)" y="0.71em">↑ Frequency</text>
  </g>
  <g aria-label="x-axis tick" aria-hidden="true" fill="none" stroke="currentColor" transform="translate(64,0)">
    <path transform="translate(55,370)" d="M0,0L0,6"></path>
    <path transform="translate(196,370)" d="M0,0L0,6"></path>
    <path transform="translate(337,370)" d="M0,0L0,6"></path>
    <path transform="translate(478,370)" d="M0,0L0,6"></path>
  </g>
  <g aria-label="x-axis tick label" transform="translate(64,9.5)">
    <text transform="translate(55,370)" y="0.71em">A</text>
    <text transform="translate(196,370)" y="0.71em">C</text>
    <text transform="translate(337,370)" y="0.71em">G</text>
    <text transform="translate(478,370)" y="0.71em">T</text>
  </g>
  <g aria-label="bar">
    <rect x="55" y="20" width="127" height="350"></rect>
    <rect x="337" y="60" width="127" height="310"></rect>
    <rect x="478" y="210" width="127" height="160"></rect>
    <rect x="196" y="190" width="127" height="180"></rect>
  </g>
</svg>