<svg class="plot" fill="currentColor" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" width="640" height="60" viewBox="0 0 640 60" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    :where(.plot) {
      --plot-background: white;
      display: block;
      height: auto;
      height: intrinsic;
      max-width: 100%;
    }

    :where(.plot text),
    :where(.plot tspan) {
      white-space: pre;
    }
  </style>
  <defs>
    <clipPath id="plot-rid-1">
      <rect x="20" y="0" width="600" height="30"></rect>
    </clipPath>
  </defs>
  <g aria-label="x-axis" transform="translate(0,30)" fill="none" font-size="10" font-variant="tabular-nums" text-anchor="middle">
    <line x1="20" x2="620" stroke="currentColor"></line>
    <g transform="translate(35,0)">
      <line y2="6" stroke="currentColor"></line>
      <text y="9" dy="0.71em" fill="currentColor">A</text>
    </g>
    <g transform="translate(181,0)">
      <line y2="6" stroke="currentColor"></line>
      <text y="9" dy="0.71em" fill="currentColor">C</text>
    </g>
    <g transform="translate(327,0)">
      <line y2="6" stroke="currentColor"></line>
      <text y="9" dy="0.71em" fill="currentColor">G</text>
    </g>
    <g transform="translate(473,0)">
      <line y2="6" stroke="currentColor"></line>
      <text y="9" dy="0.71em" fill="currentColor">T</text>
    </g>
  </g>
  <g aria-label="bar" fill="currentColor">
    <rect x="35" y="0" width="131" height="30"></rect>
    <rect x="327" y="0" width="131" height="30"></rect>
    <rect x="473" y="0" width="131" height="30"></rect>
    <rect x="181" y="0" width="131" height="30"></rect>
