<svg class="plot" fill="currentColor" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" width="640" height="60" viewBox="0 0 640 60" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    :where(.plot) {
      --plot-background: white;
      display: block;
      height: auto;
      height: intrinsic;
      max-width: 100%;
    }

    :where(.plot text),
    :where(.plot tspan) {
      white-space: pre;
    }
  </style>
  <g aria-label="x-axis tick" aria-hidden="true" fill="none" stroke="currentColor" transform="translate(0.5,0)">
    <path transform="translate(20,30)" d="M0,0L0,6"></path>
    <path transform="translate(86.667,30)" d="M0,0L0,6"></path>
    <path transform="translate(153.333,30)" d="M0,0L0,6"></path>
    <path transform="translate(220,30)" d="M0,0L0,6"></path>
    <path transform="translate(286.667,30)" d="M0,0L0,6"></path>
    <path transform="translate(353.333,30)" d="M0,0L0,6"></path>
    <path transform="translate(420,30)" d="M0,0L0,6"></path>
    <path transform="translate(486.667,30)" d="M0,0L0,6"></path>
    <path transform="translate(553.333,30)" d="M0,0L0,6"></path>
    <path transform="translate(620,30)" d="M0,0L0,6"></path>
  </g>
  <g aria-label="x-axis tick label" font-variant="tabular-nums" transform="translate(0.5,9.5)">
