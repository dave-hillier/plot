    <text transform="translate(553.333,30)" y="0.71em">8</text>
    <text transform="translate(620,30)" y="0.71em">9</text>
  </g>
  <g aria-label="dot" fill="none" stroke="currentColor" stroke-width="1.5" transform="translate(0.5,0.5)">
    <circle cx="20" cy="15" r="3"></circle>
    <circle cx="86.667" cy="15" r="3"></circle>
    <circle cx="153.333" cy="15" r="3"></circle>
