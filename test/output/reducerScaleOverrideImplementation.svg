<svg class="plot" fill="currentColor" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" width="640" height="80" viewBox="0 0 640 80" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    :where(.plot) {
      --plot-background: white;
      display: block;
      height: auto;
      height: intrinsic;
      max-width: 100%;
    }

    :where(.plot text),
    :where(.plot tspan) {
      white-space: pre;
    }
  </style>
  <defs>
    <clipPath id="plot-rid-1">
      <rect x="20" y="0" width="600" height="50"></rect>
    </clipPath>
  </defs>
  <g transform="translate(0,3)">
    <g aria-label="x-axis" transform="translate(0,50)" fill="none" font-size="10" font-variant="tabular-nums" text-anchor="middle">
      <line x1="20" x2="620" stroke="currentColor"></line>
      <g transform="translate(40,0)">
        <line y2="6" stroke="currentColor"></line>
        <text y="9" dy="0.71em" fill="currentColor">Adelie</text>
      </g>
      <g transform="translate(233,0)">
        <line y2="6" stroke="currentColor"></line>
        <text y="9" dy="0.71em" fill="currentColor">Chinstrap</text>
      </g>
      <g transform="translate(426,0)">
        <line y2="6" stroke="currentColor"></line>
        <text y="9" dy="0.71em" fill="currentColor">Gentoo</text>
      </g>
    </g>
    <g aria-label="bar" fill="currentColor">
      <rect x="40" y="0" width="174" height="50"></rect>
      <rect x="233" y="0" width="174" height="50"></rect>
      <rect x="426" y="0" width="174" height="50"></rect>
    </g>
  </g>
</svg>