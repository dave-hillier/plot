<svg class="plot" fill="currentColor" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" width="640" height="60" viewBox="0 0 640 60" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    :where(.plot) {
      --plot-background: white;
      display: block;
      height: auto;
      height: intrinsic;
      max-width: 100%;
    }

    :where(.plot text),
    :where(.plot tspan) {
      white-space: pre;
    }
  </style>
  <g aria-label="x-axis tick" aria-hidden="true" fill="none" stroke="currentColor" transform="translate(0,-0.5)">
    <path transform="translate(320,30)" d="M0,0L0,6"></path>
  </g>
  <g aria-label="x-axis tick label" transform="translate(0,9)">
    <text transform="translate(320,30)" y="0.71em">Long sentence that gets cropped after a certain length</text>
  </g>
  <g aria-label="x-axis label" transform="translate(0,27)">
    <text transform="translate(320,30)">x</text>
  </g>
  <g aria-label="tip" fill="var(--plot-background)" stroke="currentColor" text-anchor="start"></g>
</svg>