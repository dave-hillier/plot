<svg class="plot" fill="currentColor" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" width="640" height="60" viewBox="0 0 640 60" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    :where(.plot) {
      --plot-background: white;
      display: block;
      height: auto;
      height: intrinsic;
      max-width: 100%;
    }

    :where(.plot text),
    :where(.plot tspan) {
      white-space: pre;
    }
  </style>
  <g aria-label="x-axis tick" aria-hidden="true" fill="none" stroke="currentColor" transform="translate(0,-0.5)">
    <path transform="translate(20,30)" d="M0,0L0,6"></path>
    <path transform="translate(80,30)" d="M0,0L0,6"></path>
    <path transform="translate(140,30)" d="M0,0L0,6"></path>
    <path transform="translate(200,30)" d="M0,0L0,6"></path>
    <path transform="translate(260,30)" d="M0,0L0,6"></path>
    <path transform="translate(320,30)" d="M0,0L0,6"></path>
    <path transform="translate(380,30)" d="M0,0L0,6"></path>
    <path transform="translate(440,30)" d="M0,0L0,6"></path>
    <path transform="translate(500,30)" d="M0,0L0,6"></path>
    <path transform="translate(560,30)" d="M0,0L0,6"></path>
    <path transform="translate(620,30)" d="M0,0L0,6"></path>
  </g>
  <g aria-label="x-axis tick label" font-variant="tabular-nums" transform="translate(0,9)">
    <text transform="translate(20,30)" y="0.71em">0</text>
    <text transform="translate(80,30)" y="0.71em">10</text>
    <text transform="translate(140,30)" y="0.71em">20</text>
    <text transform="translate(200,30)" y="0.71em">30</text>
    <text transform="translate(260,30)" y="0.71em">40</text>
    <text transform="translate(320,30)" y="0.71em">50</text>
    <text transform="translate(380,30)" y="0.71em">60</text>
    <text transform="translate(440,30)" y="0.71em">70</text>
    <text transform="translate(500,30)" y="0.71em">80</text>
    <text transform="translate(560,30)" y="0.71em">90</text>
    <text transform="translate(620,30)" y="0.71em">100</text>
  </g>
  <g aria-label="x-axis label" text-anchor="end" transform="translate(17,27)">
    <text transform="translate(620,30)">wealth →</text>
  </g>
  <g aria-label="bar">
    <rect fill="#4269d0" x="20" y="0" width="18" height="30"></rect>
    <rect fill="#efb118" x="38" y="0" width="192" height="30"></rect>
    <rect fill="#ff725c" x="230" y="0" width="312" height="30"></rect>
    <rect fill="#6cc5b0" x="542" y="0" width="78" height="30"></rect>
  </g>
  <g aria-label="text">
    <text transform="translate(29,15)" y="0.32em">16-34’s</text>
    <text transform="translate(134,15)" y="0.32em">35-54’s</text>
    <text transform="translate(386,15)" y="0.32em">55-74’s</text>
    <text transform="translate(581,15)" y="0.32em">Over 75’s</text>
  </g>
  <g aria-label="rule" stroke="currentColor" transform="translate(0.5,0)">
    <line x1="20" x2="20" y1="0" y2="30"></line>
    <line x1="620" x2="620" y1="0" y2="30"></line>
  </g>
</svg>