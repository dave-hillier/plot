<svg class="plot" fill="currentColor" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" width="640" height="120" viewBox="0 0 640 120" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    :where(.plot) {
      --plot-background: white;
      display: block;
      height: auto;
      height: intrinsic;
      max-width: 100%;
    }

    :where(.plot text),
    :where(.plot tspan) {
      white-space: pre;
    }
  </style>
  <clipPath id="plot-clip-1">
    <rect x="40" y="20" width="580" height="70"></rect>
  </clipPath>
  <g aria-label="y-axis tick" aria-hidden="true" fill="none" stroke="currentColor" transform="translate(0,10.5)">
    <path transform="translate(40,23)" d="M0,0L-6,0"></path>
    <path transform="translate(40,45)" d="M0,0L-6,0"></path>
    <path transform="translate(40,67)" d="M0,0L-6,0"></path>
  </g>
  <g aria-label="y-axis tick label" text-anchor="end" transform="translate(-8.5,10.5)">
    <text transform="translate(40,23)" y="0.32em">A</text>
    <text transform="translate(40,45)" y="0.32em">B</text>
    <text transform="translate(40,67)" y="0.32em">C</text>
  </g>
  <g aria-label="x-axis tick" aria-hidden="true" fill="none" stroke="currentColor" transform="translate(0.5,0)">
    <path transform="translate(137,90)" d="M0,0L0,6"></path>
    <path transform="translate(330,90)" d="M0,0L0,6"></path>
    <path transform="translate(523,90)" d="M0,0L0,6"></path>
  </g>
  <g aria-label="x-axis tick label" transform="translate(0.5,9.5)">
    <text transform="translate(137,90)" y="0.71em">A</text>
    <text transform="translate(330,90)" y="0.71em">B</text>
    <text transform="translate(523,90)" y="0.71em">C</text>
  </g>
  <g clip-path="url(#plot-clip-1)" aria-label="frame">
    <rect fill="none" stroke="currentColor" transform="translate(0.5,0.5)" x="40" y="20" width="580" height="70"></rect>
  </g>
  <g clip-path="url(#plot-clip-1)" aria-label="text">
    <g font-size="50" transform="translate(0.5,10.5)">
      <text transform="translate(137,23)" y="0.32em">A</text>
      <text transform="translate(330,45)" y="0.32em">B</text>
      <text transform="translate(523,67)" y="0.32em">C</text>
    </g>
  </g>
</svg>