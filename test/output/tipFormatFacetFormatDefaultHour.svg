      <g aria-label="fx-axis tick label" transform="translate(0,-9)">
        <text transform="translate(162,30)"><tspan x="0" y="-1em">Jan 1</tspan><tspan x="0" dy="1em">12 PM</tspan></text>
      </g>
    </g>
    <g transform="translate(316,0)">
      <g aria-label="fx-axis tick label" transform="translate(0,-9)">
        <text transform="translate(162,30)">1 PM</text>
      </g>
    </g>
  </g>
  <g>
    <g transform="translate(1,0)">
      <g aria-label="x-axis tick" aria-hidden="true" fill="none" stroke="currentColor" transform="translate(0,-0.5)">
        <path transform="translate(162,80)" d="M0,0L0,6"></path>
      </g>
    </g>
    <g transform="translate(316,0)">
      <g aria-label="x-axis tick" aria-hidden="true" fill="none" stroke="currentColor" transform="translate(0,-0.5)">
        <path transform="translate(162,80)" d="M0,0L0,6"></path>
      </g>
    </g>
  </g>
  <g>
    <g transform="translate(1,0)">
      <g aria-label="x-axis tick label" font-variant="tabular-nums" transform="translate(0,9)">
