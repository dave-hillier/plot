<svg class="plot-ramp" font-family="system-ui, sans-serif" font-size="10" width="240" height="44" viewBox="0 0 240 44" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    :where(.plot-ramp) {
      display: block;
      height: auto;
      height: intrinsic;
      max-width: 100%;
      overflow: visible;
    }

    :where(.plot-ramp text) {
      white-space: pre;
    }
  </style>
  <g>
    <rect x="1" y="18" width="33" height="10" fill="#d53e4f"></rect>
    <rect x="35" y="18" width="33" height="10" fill="#fc8d59"></rect>
    <rect x="69" y="18" width="33" height="10" fill="#fee08b"></rect>
    <rect x="103" y="18" width="33" height="10" fill="#ffffbf"></rect>
    <rect x="137" y="18" width="33" height="10" fill="#e6f598"></rect>
    <rect x="171" y="18" width="33" height="10" fill="#99d594"></rect>
    <rect x="205" y="18" width="33" height="10" fill="#3288bd"></rect>
  </g>
  <g transform="translate(0,28)">
    <g class="tick" opacity="1" transform="translate(1.5,0)">
      <line stroke="currentColor" y1="0" y2="0"></line>
      <text fill="currentColor" y="3" dy="0.71em" text-anchor="middle">&lt;20</text>
    </g>
    <g class="tick" opacity="1" transform="translate(35.5,0)">
      <line stroke="currentColor" y1="0" y2="0"></line>
      <text fill="currentColor" y="3" dy="0.71em" text-anchor="middle">20-29</text>
    </g>
    <g class="tick" opacity="1" transform="translate(69.5,0)">
      <line stroke="currentColor" y1="0" y2="0"></line>
      <text fill="currentColor" y="3" dy="0.71em" text-anchor="middle">30-39</text>
    </g>
    <g class="tick" opacity="1" transform="translate(103.5,0)">
      <line stroke="currentColor" y1="0" y2="0"></line>
      <text fill="currentColor" y="3" dy="0.71em" text-anchor="middle">40-49</text>
    </g>
    <g class="tick" opacity="1" transform="translate(137.5,0)">
      <line stroke="currentColor" y1="0" y2="0"></line>
      <text fill="currentColor" y="3" dy="0.71em" text-anchor="middle">50-59</text>
    </g>
    <g class="tick" opacity="1" transform="translate(171.5,0)">
      <line stroke="currentColor" y1="0" y2="0"></line>
      <text fill="currentColor" y="3" dy="0.71em" text-anchor="middle">60-69</text>
    </g>
    <g class="tick" opacity="1" transform="translate(205.5,0)">
      <line stroke="currentColor" y1="0" y2="0"></line>
      <text fill="currentColor" y="3" dy="0.71em" text-anchor="middle">≥70</text>
    </g>
  </g>
  <text x="0" y="12" fill="currentColor" font-weight="bold">Age (years)</text>
</svg>