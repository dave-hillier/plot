<svg class="plot" fill="currentColor" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" width="640" height="80" viewBox="0 0 640 80" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    :where(.plot) {
      --plot-background: white;
      display: block;
      height: auto;
      height: intrinsic;
      max-width: 100%;
    }

    :where(.plot text),
    :where(.plot tspan) {
      white-space: pre;
    }
  </style>
  <g aria-label="y-axis tick" aria-hidden="true" fill="none" stroke="currentColor" transform="translate(0,0.5)">
    <path transform="translate(40,50)" d="M0,0L-6,0"></path>
    <path transform="translate(40,20)" d="M0,0L-6,0"></path>
  </g>
  <g aria-label="y-axis tick label" text-anchor="end" font-variant="tabular-nums" transform="translate(-8.5,0.5)">
    <text transform="translate(40,50)" y="0.32em">0</text>
    <text transform="translate(40,20)" y="0.32em">1</text>
  </g>
  <g aria-label="y-axis label" text-anchor="start" transform="translate(-36.5,-16.5)">
    <text transform="translate(40,20)" y="0.71em">↑ Frequency</text>
  </g>
  <g aria-label="x-axis tick" aria-hidden="true" fill="none" stroke="currentColor" transform="translate(26,0)">
    <path transform="translate(48,50)" d="M0,0L0,6"></path>
    <path transform="translate(105,50)" d="M0,0L0,6"></path>
    <path transform="translate(162,50)" d="M0,0L0,6"></path>
    <path transform="translate(219,50)" d="M0,0L0,6"></path>
    <path transform="translate(276,50)" d="M0,0L0,6"></path>
    <path transform="translate(333,50)" d="M0,0L0,6"></path>
    <path transform="translate(390,50)" d="M0,0L0,6"></path>
    <path transform="translate(447,50)" d="M0,0L0,6"></path>
    <path transform="translate(504,50)" d="M0,0L0,6"></path>
    <path transform="translate(561,50)" d="M0,0L0,6"></path>
  </g>
  <g aria-label="x-axis tick label" transform="translate(26,9.5)">
    <text transform="translate(48,50)" y="0.71em">1</text>
    <text transform="translate(105,50)" y="0.71em">2</text>
    <text transform="translate(162,50)" y="0.71em">5</text>
    <text transform="translate(219,50)" y="0.71em">6</text>
    <text transform="translate(276,50)" y="0.71em">8</text>
