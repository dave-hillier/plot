    <text transform="translate(390,50)" y="0.71em">c</text>
    <text transform="translate(447,50)" y="0.71em">d</text>
    <text transform="translate(504,50)" y="0.71em">e</text>
    <text transform="translate(561,50)" y="0.71em">f</text>
  </g>
  <g aria-label="bar">
    <rect x="447" y="20" width="51" height="30"></rect>
    <rect x="504" y="20" width="51" height="30"></rect>
    <rect x="48" y="20" width="51" height="30"></rect>
    <rect x="162" y="20" width="51" height="30"></rect>
    <rect x="219" y="20" width="51" height="30"></rect>
    <rect x="333" y="20" width="51" height="30"></rect>
    <rect x="105" y="20" width="51" height="30"></rect>
    <rect x="561" y="20" width="51" height="30"></rect>
    <rect x="390" y="20" width="51" height="30"></rect>
    <rect x="276" y="20" width="51" height="30"></rect>
