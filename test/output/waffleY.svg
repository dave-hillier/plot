<svg class="plot" fill="currentColor" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" width="640" height="400" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    :where(.plot) {
      --plot-background: white;
      display: block;
      height: auto;
      height: intrinsic;
      max-width: 100%;
    }

    :where(.plot text),
    :where(.plot tspan) {
      white-space: pre;
    }
  </style>
  <defs>
    <clipPath id="plot-rid-1">
      <rect x="20" y="0" width="600" height="370"></rect>
    </clipPath>
  </defs>
  <g aria-label="x-axis" transform="translate(0,370)" fill="none" font-size="10" font-variant="tabular-nums" text-anchor="middle">
    <line x1="20" x2="620" stroke="currentColor"></line>
    <g transform="translate(33,0)">
      <line y2="6" stroke="currentColor"></line>
      <text y="9" dy="0.71em" fill="currentColor">Adults 18+</text>
    </g>
    <g transform="translate(150,0)">
      <line y2="6" stroke="currentColor"></line>
      <text y="9" dy="0.71em" fill="currentColor">Children &lt;11</text>
    </g>
    <g transform="translate(267,0)">
      <line y2="6" stroke="currentColor"></line>
      <text y="9" dy="0.71em" fill="currentColor">Elderly 65+</text>
    </g>
    <g transform="translate(384,0)">
      <line y2="6" stroke="currentColor"></line>
      <text y="9" dy="0.71em" fill="currentColor">Infants &lt;1</text>
    </g>
    <g transform="translate(501,0)">
      <line y2="6" stroke="currentColor"></line>
      <text y="9" dy="0.71em" fill="currentColor">Teens 12-17</text>
    </g>
  </g>
  <g aria-label="y-axis left" transform="translate(20,0)" fill="none" font-size="10" font-variant="tabular-nums" text-anchor="end">
    <line y1="0" y2="370" stroke="currentColor" stroke-opacity="1"></line>
    <g transform="translate(0,185)">
      <line x2="-6" stroke="currentColor" stroke-opacity="1"></line>
      <text x="-9" dy="0.32em" fill="currentColor">0</text>
    </g>
    <text transform="translate(-45,0) rotate(-90)" fill="currentColor" text-anchor="end" font-size="12" font-variant="normal">↑ Frequency (thousands)</text>
  </g>
  <g aria-label="waffle" fill="currentColor">00000</g>
  <g aria-label="rule" stroke="currentColor">0</g>
</svg>