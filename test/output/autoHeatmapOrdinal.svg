<svg class="plot" fill="currentColor" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" width="640" height="120" viewBox="0 0 640 120" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    :where(.plot) {
      --plot-background: white;
      display: block;
      height: auto;
      height: intrinsic;
      max-width: 100%;
    }

    :where(.plot text),
    :where(.plot tspan) {
      white-space: pre;
    }
  </style>
  <g aria-label="y-axis tick" aria-hidden="true" fill="none" stroke="currentColor" transform="translate(0,10.5)">
    <path transform="translate(40,23)" d="M0,0L-6,0"></path>
    <path transform="translate(40,45)" d="M0,0L-6,0"></path>
    <path transform="translate(40,67)" d="M0,0L-6,0"></path>
  </g>
  <g aria-label="y-axis tick label" text-anchor="end" transform="translate(-8.5,10.5)">
    <text transform="translate(40,23)" y="0.32em">Adelie</text>
    <text transform="translate(40,45)" y="0.32em">Chinstrap</text>
    <text transform="translate(40,67)" y="0.32em">Gentoo</text>
  </g>
  <g aria-label="y-axis label" transform="translate(-36.5,0.5)">
    <text transform="translate(40,55) rotate(-90)" y="0.71em">species</text>
  </g>
  <g aria-label="x-axis tick" aria-hidden="true" fill="none" stroke="currentColor" transform="translate(84.5,0)">
    <path transform="translate(59,90)" d="M0,0L0,6"></path>
    <path transform="translate(246,90)" d="M0,0L0,6"></path>
    <path transform="translate(433,90)" d="M0,0L0,6"></path>
  </g>
  <g aria-label="x-axis tick label" transform="translate(84.5,9.5)">
    <text transform="translate(59,90)" y="0.71em">Biscoe</text>
    <text transform="translate(246,90)" y="0.71em">Dream</text>
    <text transform="translate(433,90)" y="0.71em">Torgersen</text>
  </g>
  <g aria-label="x-axis label" transform="translate(0.5,27.5)">
    <text transform="translate(330,90)">island</text>
  </g>
  <g aria-label="cell">
    <rect fill="rgb(74, 88, 221)" x="433" y="23" width="168" height="20"></rect>
    <rect fill="rgb(35, 23, 27)" x="59" y="23" width="168" height="20"></rect>
    <rect fill="rgb(62, 123, 247)" x="246" y="23" width="168" height="20"></rect>
    <rect fill="rgb(39, 215, 196)" x="246" y="45" width="168" height="20"></rect>
    <rect fill="rgb(144, 12, 0)" x="59" y="67" width="168" height="20"></rect>
  </g>
  <g aria-label="tip" fill="var(--plot-background)" stroke="currentColor" text-anchor="start" transform="translate(84.5,10.5)" pointer-events="none"></g>
</svg>